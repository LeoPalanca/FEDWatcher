server {
    server_name fakefed.ellep.it;

    root /var/www/fakefed;
    index index.html;

    access_log /var/log/nginx/fakefed.access.log;
    error_log /var/log/nginx/fakefed.error.log;

    location /api/ {
        proxy_pass http://127.0.0.1:8018;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/fakefed.ellep.it/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/fakefed.ellep.it/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = fakefed.ellep.it) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name fakefed.ellep.it;
    return 404; # managed by Certbot
}
